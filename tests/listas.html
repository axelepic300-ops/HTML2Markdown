
<!DOCTYPE html>
<html>
<head>
    <title>Prueba de listas</title>
</head>
<body>
<h1>Tipos de listas</h1>

<h2>Lista desordenada</h2>
<ul>
    <li>Java</li>
    <li>Python</li>
    <li>C++</li>
</ul>

<h2>Lista ordenada</h2>
<ol>
    <li>Primero</li>
    <li>Segundo</li>
    <li>Tercero</li>
</ol>

<h2>Lista anidada</h2>
<ul>
    <li>Programación
        <ul>
            <li>Java</li>
            <li>Python</li>
        </ul>
    </li>
    <li>Diseño</li>
</ul>
</body>
</html>
